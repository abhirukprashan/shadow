[package]
name = "shadow"
version = "0.1.0"
edition = "2024"
authors = ["Abhiruk Perera"]
license = "MIT OR Apache-2.0"
description = "High-performance CoW workspace orchestration engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
redb = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"
diff = "0.1"
colored = "2.1"
fs_extra = "1.3"
tempfile = "3.13"
nix = { version = "0.29", features = ["ioctl", "fs"] }
libc = "0.2"
sysinfo = "0.32"
sha2 = "0.10"
hex = "0.4"
